  <style>
    :root {
      --bg: #f5f7f9;
      --bg-warm: #eaeef2;
      --surface: #ffffff;
      --surface-2: #f7fafc;

      --ink: #0A2540;
      --ink-2: #22374f;
      --muted: #61748a;
      --faint: #93a3b5;

      --line: #dde5ec;
      --line-strong: #c3d0dc;

      --accent: #00875A;
      --accent-soft: #e8f7f0;
      --accent-ink: #ffffff;

      --gold: #D4AF37;
      --ink-hover: #06182a;
      --accent-hover: #006b48;
      --accent-line: #e0ce9a;

      --radius: 16px;
      --radius-sm: 10px;
      --wrap: 1320px;

      --serif: "Playfair Display", Georgia, "Times New Roman", serif;
      --sans: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;

      --shadow-sm: 0 1px 2px rgba(10,37,64,.05), 0 2px 8px rgba(10,37,64,.05);
      --shadow-md: 0 4px 12px rgba(10,37,64,.07), 0 12px 32px rgba(10,37,64,.08);
      --shadow-lg: 0 8px 24px rgba(0,135,90,.12), 0 24px 60px rgba(10,37,64,.12);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--sans);
      background-color: var(--bg);
      color: var(--ink);
      font-size: 17px;
      line-height: 1.62;
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    h1, h2, h3, h4 {
      font-family: var(--serif);
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.015em;
      color: var(--ink);
    }

    a, button {
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      border: none;
      background: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .site-wrap {
      max-width: var(--wrap);
      margin-left: auto;
      margin-right: auto;
      padding-left: 24px;
      padding-right: 24px;
      width: 100%;
    }

    .kicker {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
      display: inline-block;
    }

    .card-elevated {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 30px 28px 28px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1), 
                  box-shadow 0.24s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.24s ease;
      display: flex;
      flex-direction: column;
      justifyContent: space-between;
    }

    .card-elevated:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--line-strong);
    }

    .card-gold-accent {
      border-top: 3px solid var(--gold);
    }

    .btn-primary {
      padding: 15px 30px;
      background-color: var(--ink);
      color: #ffffff;
      border-radius: var(--radius-sm);
      font-size: 15.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary:hover {
      background-color: var(--ink-hover);
      box-shadow: var(--shadow-sm);
    }

    .btn-accent {
      padding: 15px 30px;
      background-color: var(--accent);
      color: var(--accent-ink);
      border-radius: var(--radius-sm);
      font-size: 15.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-accent:hover {
      background-color: var(--accent-hover);
      box-shadow: var(--shadow-lg);
    }

    .btn-secondary {
      padding: 14px 28px;
      background-color: var(--surface);
      color: var(--ink);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      font-size: 15.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-secondary:hover {
      border-color: var(--ink);
    }

    /* Адаптивная навигация */
    @media (max-width: 960px) {
      .desktop-only { display: none !important; }
      .mobile-only { display: flex !important; }
    }
    @media (min-width: 961px) {
      .desktop-only { display: flex !important; }
      .mobile-only { display: none !important; }
    }
  </style>
